<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2937" />
    <title>Drive Notes</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Drive Notes</h1>
        <p>Write notes on your phone and save them directly to a file in Google Drive.</p>
      </header>

      <section class="card">
        <h2>Setup</h2>
        <label for="clientId">Google OAuth Client ID</label>
        <input id="clientId" type="text" placeholder="1234567890-xxxxx.apps.googleusercontent.com" />

        <label for="folderId">Google Drive Folder ID</label>
        <input id="folderId" type="text" placeholder="Folder ID from your Drive URL" />

        <label for="fileName">Notes File Name</label>
        <input id="fileName" type="text" value="phone-notes.txt" />

        <div class="button-row">
          <button id="connectBtn">Connect Google Drive</button>
          <button id="disconnectBtn" class="secondary" disabled>Disconnect</button>
        </div>
      </section>

      <section class="card">
        <h2>Your Notes</h2>
        <textarea id="notesInput" rows="12" placeholder="Start typing your notes here..."></textarea>
        <div class="button-row">
          <button id="loadBtn" class="secondary" disabled>Load from Drive</button>
          <button id="saveBtn" disabled>Save to Drive</button>
        </div>
        <p id="status" class="status">Set up your Client ID and connect to start.</p>
      </section>
    </main>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="app.js"></script>
  </body>
</html>
